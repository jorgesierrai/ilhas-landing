<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ilhas · el hero del home con el loop de Kinzal — referencia medida</title>
<style>
@font-face{font-family:"Space Grotesk";src:url(/assets/fonts/space-grotesk-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Inter";src:url(/assets/fonts/inter-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Inter";src:url(/assets/fonts/inter-500.woff2) format("woff2");font-weight:500;font-display:swap}
:root{
  --ilhas-primary:#7A3CFF; --ilhas-dark:#0E0E0F;
  --ilhas-grad-start:#55E8FF; --ilhas-grad-end:#A14BFF;
  --ilhas-font-display:"Space Grotesk",system-ui,sans-serif;
  --ilhas-font-body:"Inter",system-ui,-apple-system,sans-serif;
  --ilhas-container:1140px; --ilhas-gutter:clamp(1.25rem,4vw,3rem);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--ilhas-font-body);background:var(--ilhas-dark);
  color:rgba(248,250,255,.7);line-height:1.6}
.rotulo{padding:.9rem clamp(1.25rem,4vw,3rem);background:#1b1b20;color:#8f8fa3;
  font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.text-gradient{background:linear-gradient(100deg,var(--ilhas-grad-start),var(--ilhas-grad-end));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;
  padding:.8rem 1.5rem;border-radius:999px;font-weight:600;font-size:.9375rem;
  text-decoration:none;border:1px solid transparent}
.btn-primary{background:var(--ilhas-primary);color:#fff}
.btn-ghost-oscuro{border-color:rgba(248,250,255,.3);color:#fff}

.hero{position:relative;display:flex;align-items:center;min-height:620px;
  overflow:hidden;background:var(--ilhas-dark)}
.hero__inner{position:relative;z-index:3;width:100%;
  max-width:var(--ilhas-container);margin-inline:auto;
  padding-inline:var(--ilhas-gutter)}
.hero h1{font-family:var(--ilhas-font-display);font-weight:600;
  font-size:clamp(2.1rem,4.6vw,3.4rem);line-height:1.08;letter-spacing:-.03em;
  color:#fff;margin:0;max-width:15ch}
.hero__lead{margin:1.4rem 0 0;font-size:1.0625rem;max-width:38ch;
  color:rgba(248,250,255,.74)}
.hero__ctas{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:2rem}
.hero__kpis{display:flex;flex-wrap:wrap;gap:2.5rem;margin-top:3rem}
.kpi{text-shadow:0 1px 12px rgba(14,14,15,.95)}
.kpi b{display:block;font-family:var(--ilhas-font-display);font-weight:600;
  font-size:1.9rem;line-height:1;color:#fff}
.kpi span{display:block;margin-top:.35rem;font-size:.8125rem;
  color:rgba(248,250,255,.55);max-width:20ch}


.hero{position:relative;background:var(--ilhas-dark)}
.hero__medio video,.hero__medio img{width:100%;height:100%;
  object-fit:contain;display:block}

/* --- MOVIMIENTO REDUCIDO ---
   Obligatorio. Un loop que arranca solo y no para es exactamente lo que esta
   media query existe para apagar. El póster NO es el primer cuadro sino el
   último —el bloque verde del ahorro—: si alguien nunca ve el video, tiene
   que quedarse con el resultado.
   0,2,0 para que le gane a `.hero__medio img`, que también es 0,2,0 pero va
   antes. Con `.hero__poster` a secas (0,1,0) el póster se pintaba SIEMPRE,
   debajo del video. */
.hero__medio .hero__poster{display:none}
@media (prefers-reduced-motion: reduce){
  .hero__medio video{display:none}
  .hero__medio .hero__poster{display:block}
}
/* ==========================================================================
   F · LA BUENA — dos columnas reales, el cuadro entero y a la derecha
   ==========================================================================
   Se probaron cinco. Lo que se aprendió:
     · Centrado en vertical (A/B/C) choca con la fila de KPI.
     · Achicándolo a 52% (D) el panel de KINZAL se vuelve ilegible: la demo
       deja de probar nada.
     · El velo del hero viejo apagaba la captura. Existía para que el texto
       se leyera ENCIMA de la foto; ahora el texto y el video no se tocan.
   Así que: columna de texto fija a la izquierda, el cuadro completo a la
   derecha sangrando hasta el canto del navegador, y los KPI corriendo a todo
   lo ancho por debajo de los dos. */
.v-f{display:block;position:relative;overflow:hidden;min-height:0;
  padding-block:clamp(2.75rem,5vw,4.25rem) clamp(2.25rem,4vw,3.25rem)}
.v-f .hero__inner{position:relative;z-index:3}
.v-f .hero__resplandor{position:absolute;z-index:0;right:-10%;top:-10%;
  width:74%;height:86%;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 50%,rgba(122,60,255,.32),transparent 70%)}
/* Sangra hasta el canto: el `right` negativo compensa el gutter del
   contenedor, así que el borde derecho del cuadro cae en el borde del
   navegador y no en el del contenedor. Sin recorte: la caja lleva la
   relación de aspecto del video. */
.v-f .hero__medio{position:absolute;right:calc(-1 * var(--ilhas-gutter));
  top:.5rem;translate:none;z-index:1;width:58%;aspect-ratio:1280/604;
  border-radius:12px 0 0 12px;overflow:hidden;
  border:1px solid rgba(248,250,255,.14);border-right:0;
  box-shadow:0 40px 80px -30px rgba(0,0,0,.95)}
.v-f .hero__texto{position:relative;z-index:3;max-width:38%;min-height:21rem}
/* 12ch para que el titular rompa en TRES líneas y no en cuatro con «IA.»
   colgando sola en la última. */
.v-f h1{max-width:12ch;font-size:clamp(2rem,3.6vw,2.9rem)}
.v-f .hero__lead{max-width:30ch}
.v-f .hero__kpis{margin-top:clamp(2rem,3.5vw,2.75rem)}
.v-f .hero__velo{display:none}
@media (max-width:899px){
  .v-f .hero__medio{position:relative;right:auto;top:auto;width:100%;
    margin-top:2.25rem;border-radius:10px;border-right-width:1px}
  .v-f .hero__texto{max-width:none;min-height:0}
  .v-f h1,.v-f .hero__lead{max-width:none}
}

</style></head><body>

<section class="hero v-f">
  <div class="hero__inner">
    <div class="hero__resplandor" aria-hidden="true"></div>

    <div class="hero__texto">
      <h1>Tu primer proceso corriendo <span class="text-gradient">con agentes de IA</span>.</h1>
      <p class="hero__lead">
        Lo que hoy le toma horas a alguien de tu equipo, hecho por un sistema
        que t&#250; entiendes y que corre solo.
      </p>
      <div class="hero__ctas">
        <a href="/finanzas" class="btn btn-primary">Quiero aprenderlo</a>
        <a href="/soluciones" class="btn btn-ghost-oscuro">Quiero implementarlo</a>
      </div>
    </div>

    <!-- El medio va DESPU&#201;S del texto en el DOM.
         En escritorio es `position:absolute`, as&#237; que el orden da igual; en
         m&#243;vil pasa a `relative` y el orden ES el que manda. Con el medio
         primero, el video sal&#237;a ARRIBA del titular. -->
    <div class="hero__medio" aria-hidden="true">
      <video poster="/assets/video/home-hero-loop.jpg"
             autoplay muted loop playsinline preload="metadata"
             width="1280" height="604">
        <source src="/assets/video/home-hero-loop.mp4" type="video/mp4">
      </video>
      <img class="hero__poster" src="/assets/video/home-hero-loop.jpg" alt=""
           width="1280" height="604">
    </div>

    <div class="hero__kpis">
      <div class="kpi"><b>+1,000 MDP</b><span>al mes, volumen respaldado</span></div>
      <div class="kpi"><b>6+</b><span>startups &#183; infraestructura creada</span></div>
      <div class="kpi"><b>2016&#8594;</b><span>desarrollando IA</span></div>
    </div>
  </div>
</section>

</body></html>
