<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 72" width="236" height="72" role="img" aria-label="Ilhas logo">
  <defs>
    <linearGradient id="ilhasGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#55E8FF"/>
      <stop offset="50%"  stop-color="#8E5BFF"/>
      <stop offset="100%" stop-color="#A14BFF"/>
    </linearGradient>
    <style><![CDATA[
      /* SVG usado via img, favicon o background-image no carga @font-face
         externo; sin este bloque el wordmark cae a la tipografia del sistema. */
      @font-face {
        font-family: 'Ilhas Logo Grotesk';
        font-weight: 600;
        font-style: normal;
        font-display: swap;
        src: url("data:font/woff2;base64,") format('woff2');
      }
    ]]></style>
  </defs>

  <!-- Mark: gradient circle + white inner dot -->
  <circle cx="36" cy="36" r="33" fill="url(#ilhasGrad)"/>
  <circle cx="36" cy="36" r="14.5" fill="#FFFFFF" fill-opacity="0.92"/>

  <!-- Wordmark -->
  <text
    x="82"
    y="36"
    font-family="'Ilhas Logo Grotesk', 'Space Grotesk', 'Inter', system-ui, sans-serif"
    font-size="33"
    font-weight="600"
    letter-spacing="-0.8"
    dominant-baseline="central"
    fill="#FFFFFF"
  >ilhas</text>
</svg>
